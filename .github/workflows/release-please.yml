name: release-please
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-lockfile:
    runs-on: ubuntu-latest
    needs: release-please
    if: always()
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - name: Regenerar uv.lock si esta desactualizado
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.SAFETY_INDEX_URL }}
        run: uv lock --check || uv lock
      - name: Commitear uv.lock si cambio
        run: |
          git diff --quiet uv.lock || {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sincroniza uv.lock tras release"
            git push
          }
